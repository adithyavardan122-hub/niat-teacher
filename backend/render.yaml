services:
  - type: web
    name: niat-teachers-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://your-app.vercel.app   # replace with your actual Vercel URL
      - key: ELEVENLABS_API_KEY
        sync: false   # set this in Render dashboard — do not hardcode
      - key: FIREBASE_PROJECT_ID
        value: niatteachers
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false   # paste the full serviceAccountKey.json contents (as one-line JSON) in Render dashboard
